version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'saturday'
      time: '00:00'
    commit-message:
      prefix: 'ci'
    labels:
      - 'Scope: Dependencies'
      - 'Type: Maintenance'
    open-pull-requests-limit: 10
    pull-request-branch-name:
      separator: '-'
    rebase-strategy: 'auto'
    cooldown:
      default-days: 7
    groups:
      default:
        patterns:
          - '*'
    ignore:
      - dependency-name: leaflet
      - dependency-name: '@fortawesome/fontawesome-free'
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'saturday'
      time: '00:00'
    commit-message:
      prefix: 'ci'
    labels:
      - 'Scope: Dependencies'
      - 'Type: Maintenance'
    open-pull-requests-limit: 10
    pull-request-branch-name:
      separator: '-'
    rebase-strategy: 'auto'
    cooldown:
      default-days: 7
    groups:
      default:
        patterns:
          - '*'
  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'saturday'
      time: '00:00'
    commit-message:
      prefix: 'ci'
    labels:
      - 'Scope: Dependencies'
      - 'Type: Maintenance'
    open-pull-requests-limit: 10
    pull-request-branch-name:
      separator: '-'
    rebase-strategy: 'auto'
    cooldown:
      default-days: 7
    groups:
      default:
        patterns:
          - '*'
