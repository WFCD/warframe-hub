name: CI
on:
  pull_request:
    branches:
      - dev

# Preview deploy: IDs are vars; token is secret. Forks without access skip deploy.
env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0
    - name: Use Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
    - name: Install Dependencies
      run: npm ci
    - name: Validate PR commit messages
      run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Use Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
    - name: Install Dependencies
      run: npm ci
    - name: Run linters
      run: npm run lint
  test:
    name: E2E
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser:
          - 'chrome'
#          - 'firefox'
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
    - name: Install Dependencies
      run: npm ci
    - name: Run Cypress E2E
      uses: cypress-io/github-action@fa4a118725a8f001170d49631ea89e5d66fee626 # v7.4.1
      with:
        start: npm run dev
        wait-on: 'http://localhost:8742'
        browser: ${{ matrix.browser }}
        command: npm run test:e2e
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: failure()
      with:
        name: screenshots
        path: cypress/screenshots
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: videos
        path: cypress/videos
  component:
    name: Component
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
    - name: Install Dependencies
      run: npm ci
    - name: Run Cypress component tests
      uses: cypress-io/github-action@fa4a118725a8f001170d49631ea89e5d66fee626 # v7.4.1
      with:
        browser: chrome
        component: true
        command: npm run test:component
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: failure()
      with:
        name: component-screenshots
        path: cypress/screenshots
  preview:
    name: Preview
    runs-on: ubuntu-latest
    needs: [commitlint, lint, test, component]
    # Same-repo PRs only (forks lack Vercel secrets). Secrets cannot be read in `if`.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Require Vercel config
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      run: |
        if [ -z "$VERCEL_TOKEN" ]; then
          echo "::error::Missing VERCEL_TOKEN secret"
          exit 1
        fi
        if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
          echo "::error::Missing VERCEL_ORG_ID and/or VERCEL_PROJECT_ID repository variables"
          exit 1
        fi
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
    - name: Install Vercel CLI
      run: npm install --global vercel@latest
    - name: Trigger preview via Deploy Hook
      id: hook
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        BRANCH: ${{ github.head_ref }}
        HOOK_NAME: ci-preview-${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        set -euo pipefail
        node scripts/ci-vercel-preview-hook.mjs | tee /tmp/vercel-hook.log
        {
          echo "### Preview"
          echo ""
          echo "Deploy Hook triggered for branch \`${BRANCH}\`."
          echo "Vercel will build that ref from Git (no local amend / no push)."
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Comment preview status on PR
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      with:
        script: |
          const branch = '${{ github.head_ref }}';
          const marker = '<!-- hub-vercel-preview -->';
          const body = `${marker}\n### Preview\n\nDeploy Hook triggered for \`${branch}\` after CI passed.\n\nCheck the [Vercel dashboard](https://vercel.com) for the preview URL once the build finishes.\n`;
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find((c) => c.body?.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
