name: Release
on:
  push:
    branches:
        - dev

permissions:
  contents: read

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Validate pushed commit messages
        run: npx commitlint --from ${{ github.event.before }} --to ${{ github.sha }}
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run linters
        run: npm run lint
  property:
    name: Property
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run property tests
        run: npm run test:property
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        browser:
          - 'chrome'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Run Cypress
        uses: cypress-io/github-action@09090944bd8aaa2a517cefb6e38bf1aae336b42b # v7.4.3
        with:
          build: npm run build
          start: npm start
          wait-on: 'http://localhost:8742'
          browser: ${{ matrix.browser }}
  semantic-release:
    runs-on: ubuntu-latest
    needs: ['commitlint', 'lint', 'property', 'test']
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Semantic Release
        id: release
        run: npx --no-install semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          DOCKER_REGISTRY_USER: ${{ github.actor }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Cosign
        if: ${{ steps.release.outputs.release == 'yes' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install Syft
        if: ${{ steps.release.outputs.release == 'yes' }}
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: Resolve image digest
        id: digest
        if: ${{ steps.release.outputs.release == 'yes' }}
        env:
          VERSION: ${{ steps.release.outputs.new_release_version }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/wfcd/warframe-hub:${VERSION}"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}" --format '{{.Manifest.Digest}}')"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "Resolved ${IMAGE}@${DIGEST}"
      - name: Generate SBOM
        if: ${{ steps.release.outputs.release == 'yes' }}
        run: |
          set -euo pipefail
          syft "ghcr.io/wfcd/warframe-hub@${{ steps.digest.outputs.digest }}" \
            -o spdx-json=sbom.spdx.json
      - name: Sign container image
        if: ${{ steps.release.outputs.release == 'yes' }}
        env:
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          cosign sign --yes --recursive \
            -a "repo=${{ github.repository }}" \
            -a "workflow=${{ github.workflow }}" \
            -a "ref=${{ github.sha }}" \
            "ghcr.io/wfcd/warframe-hub@${{ steps.digest.outputs.digest }}"
      - name: Attest SBOM
        if: ${{ steps.release.outputs.release == 'yes' }}
        env:
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          cosign attest --yes \
            --type spdxjson \
            --predicate sbom.spdx.json \
            "ghcr.io/wfcd/warframe-hub@${{ steps.digest.outputs.digest }}"
      - name: Attest build provenance
        id: provenance
        if: ${{ steps.release.outputs.release == 'yes' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/wfcd/warframe-hub
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
      - name: Attach SLSA provenance to GitHub Release
        if: ${{ steps.release.outputs.release == 'yes' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.new_release_version }}
          TAG: ${{ steps.release.outputs.new_release_git_tag }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${TAG:-v${VERSION}}"
          OUT="warframe-hub-${VERSION}.intoto.jsonl"
          cp "${BUNDLE}" "${OUT}"
          gh release upload "${RELEASE_TAG}" "${OUT}" --clobber
      - name: Scan image with Trivy
        if: ${{ steps.release.outputs.release == 'yes' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ghcr.io/wfcd/warframe-hub@${{ steps.digest.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Upload Trivy SARIF
        if: ${{ steps.release.outputs.release == 'yes' }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
      - name: Create Sentry release
        if: ${{ steps.release.outputs.release == 'yes' }}
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          environment: production
